plugins {
    id 'java-library'
}

group = 'io.github.sob1234509876.oc'
version = '2.0a'
description = 'Omni Com RTS Engine'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
//    mavenCentral()
    maven {
        url = uri('https://maven.aliyun.com/repository/public')
    }
}

dependencies {
    // The engine itself is plain Java 17 (JPMS); its only dependency is the in-repo googology library,
    // which supplies the Natural number type used for item amounts, capacities, health and damage.
    api project(':projects:oc:oc-googology')
    // Uncomment together with the first framework based tests (needs the mirror above to be reachable):
//    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
//    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Scenario catalogues and user code may contain non-ASCII text (item display names, comments), so the
// build must not fall back to the platform encoding, which is GBK on a Chinese Windows install.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// test {
//     useJUnitPlatform()
// }

// The headless self check is a runnable program, not a framework based test suite, so it lives in its
// own source set. That keeps the standard test task completely source free (Gradle 9 fails a test task
// that discovers sources but executes no tests, and there is no test framework on the classpath here),
// while 'scenario' below runs the program against the main classes. When real unit tests arrive,
// uncomment the JUnit block above and put them in src/test/java as usual.
sourceSets {
    selfCheck {
        java.srcDir 'src/selfcheck/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Self check of the engine: a headless scenario that exercises the chunked map, formation movement,
// storage and production, animation and the snapshot API. It needs no test framework and no network,
// so it runs with: ./gradlew :projects:oc:oc-rts-engine:scenario
tasks.register('scenario', JavaExec) {
    group = 'verification'
    description = 'Runs the headless RTS engine self check scenario.'
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'io.github.sob1234509876.oc.rts.scenario.RtsScenario'
}