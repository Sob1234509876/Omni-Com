plugins {
    id 'java-library'
}

group = 'io.github.sob1234509876.oc'
version = '2.0a'
description = 'Omni Com Googology'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
//    mavenCentral()
    maven {
        url = uri('https://maven.aliyun.com/repository/public')
    }
}

dependencies {
    // Pure Java 17 on the module path, with no third-party dependencies.
}

// Comments and descriptions may contain non-ASCII text, so the build must not fall back to the
// platform encoding, which is GBK on a Chinese Windows install.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
javadoc {
    options {
        encoding = "UTF-8"
        charSet = "UTF-8"
        docEncoding = "UTF-8"
    }
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addStringOption('Xdoclint:none', '-quiet')
}

// The self check is a runnable program rather than a framework based test suite, so it lives in its own
// source set and the standard test task stays source free (Gradle 9 fails a test task that discovers
// sources but executes no tests). Runs with: ./gradlew :projects:oc:oc-googology:selfcheck
sourceSets {
    selfCheck {
        java.srcDir 'src/selfcheck/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Gradle does not forward -D flags from the Gradle CLI into a forked JavaExec JVM, so the tool tasks
// pick up the documented tuning properties themselves (-Dgoogology.check.seed / googology.check.rounds,
// -Drandomaudit.seed / randomaudit.count, -Dworkbench.filter).
def toolSystemProperties() {
    System.getProperties().findAll { key, _ ->
        def name = key.toString()
        name.startsWith('googology.check.') || name.startsWith('randomaudit.') || name.startsWith('workbench.')
    }
}

tasks.register('selfcheck', JavaExec) {
    group = 'verification'
    description = 'Runs the googology library self check.'
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'io.github.sob1234509876.oc.googology.check.GoogologyCheck'
    systemProperties(toolSystemProperties())
}

// The performance workbench: a dependency free micro benchmark over the library's own value shapes.
// Runs with: ./gradlew :projects:oc:oc-googology:workbench  (-Dworkbench.filter='tower bms' selects)
tasks.register('workbench', JavaExec) {
    group = 'verification'
    description = 'Runs the performance workbench over the googology values.'
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'io.github.sob1234509876.oc.googology.check.Workbench'
    systemProperties(toolSystemProperties())
}

// The random operation auditor: random computations across every value shape with detailed output and
// the documented consistency checks. Runs with: ./gradlew :projects:oc:oc-googology:randomaudit
// (-Drandomaudit.seed / -Drandomaudit.count make a run reproducible and sized)
tasks.register('randomaudit', JavaExec) {
    group = 'verification'
    description = 'Runs the random big-number operation auditor.'
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'io.github.sob1234509876.oc.googology.check.RandomAudit'
    systemProperties(toolSystemProperties())
}

// The owner's debugging calculator: an interactive REPL over the googology layer. stdin is inherited, so
// piping a command in works for scripted use; ./gradlew :projects:oc:oc-googology:calc starts it.
tasks.register('calc', JavaExec) {
    group = 'verification'
    description = 'Starts the interactive big-number calculator REPL.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.sob1234509876.oc.googology.calc.Calc'
    standardInput = System.in
}