plugins {
    id 'java-library'
}

group = 'io.github.sob1234509876.oc'
version = '2.0a'
description = 'Omni Com Googology'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
//    mavenCentral()
    maven {
        url = uri('https://maven.aliyun.com/repository/public')
    }
}

dependencies {
    // Pure Java 17 on the module path, with no third-party dependencies.
}

// Comments and descriptions may contain non-ASCII text, so the build must not fall back to the
// platform encoding, which is GBK on a Chinese Windows install.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The self check is a runnable program rather than a framework based test suite, so it lives in its own
// source set and the standard test task stays source free (Gradle 9 fails a test task that discovers
// sources but executes no tests). Runs with: ./gradlew :projects:oc:oc-googology:selfcheck
sourceSets {
    selfCheck {
        java.srcDir 'src/selfcheck/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('selfcheck', JavaExec) {
    group = 'verification'
    description = 'Runs the googology library self check.'
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'io.github.sob1234509876.oc.googology.check.GoogologyCheck'
}